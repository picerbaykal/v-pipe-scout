name: v-pipe-scout-app
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.13
  - streamlit=1.51.0
  - matplotlib
  - numpy
  - pandas=2.2.3
  - pyyaml
  - aiohttp
  - requests
  - pytest
  - pytest-asyncio
  - pytest-mock
  # pydantic 2 (2026-10-08), as in the worker: app/api/signatures.py runs in
  # both. streamlit-pydantic removed: nothing in the app imports it.
  - pydantic>=2.10,<3
  - plotly>=6.2.0
  - pip
  - celery==5.5.3
  - pip:
      - matplotlib-venn
      - redis==5.0.1
      - streamlit-autorefresh
      - st-theme
