scope:
  # Query only positions where the panel variants disagree. Positions where
  # every panel variant carries the same mutation cannot change the
  # matched/unexplained decision, so they are pure cost.
  discriminating_positions_only: false

  # Build the co-occurrence position set from all tracked (cowwid/OT) variant
  # signatures rather than just the selected panel. This is what makes the
  # scanner able to detect OT variants missing from the panel.
  use_tracked_variants: true

# ── ★ markers — shared by the co-occurrence check and the scanner ──────────
# A mutation is a ★ (specific) marker for a variant/finding when few lineages
# OUTSIDE its own family carry it (its own sublineages never count against it).
# Worker setting: changing it needs a worker restart + re-scan.
markers:
  out_other_max: 5      # carriers outside the family and outside other
                        #   recombinant roots (the real competitors)
  out_rec_max: 60       # carriers under other recombinant roots (XFY, XHA … that
                        #   inherited the mutation — relatives, tolerated)

# ── Co-occurrence check: a vote among each panel variant's ★ markers ────────
# Per city, pooled over the selected window. Reads only — never the
# deconvolution abundance. Applied in the UI: a streamlit restart is enough.
check:
  min_cov: 100          # reads covering a marker to measure it
  present_freq: 0.05    # present: >= 5% of covering reads carry it ...
  link_min: 0.8         # ... and >= 80% of those match the variant at neighbouring
  min_link: 20          #     positions (needs >= 20 such reads)
  absent_freq: 0.01     # absent: < 1% carry it
  confirm_share: 0.75   # present / measurable >= this -> confirmed
  notfound_share: 0.25  # present / measurable <= this -> not found; between -> inconsistent

# ── Scanner: names co-occurrence signal the panel doesn't explain ──────────
# Worker settings: changing them needs a worker restart + re-scan.
scanner:
  min_fingerprint: 2          # mutations beyond the panel needed on a read to START
                              #   a finding (1 = allele frequency, not a haplotype)
  read_threshold_max: 500     # reads behind one fingerprint (summed over fragments),
  read_threshold_share: 0.005 #   scaled down for small cities: min(max, share x all
  read_threshold_floor: 20    #   unexplained reads), never below the floor

                              #   many reads of its own
  small_candidate_set: 15     # <= this many matching lineages = specific enough to name
  min_family_share: 0.9       # more candidates: named if >= 90% fall in one family
  min_clade_depth: 6          # ... or if their common clade is at least this deep


# ── Evidence: when a finding is confirmed ─────────────────────────────────
# A day counts when a finding's ★ evidence has >= min_reads reads that are
# >= min_share of all informative reads that day (matched + unexplained).
# Confirmed with >= min_days such days; fewer -> "Seen on 1 day only".
# Worker setting: changing it needs a worker restart + re-scan.
evidence:
  min_reads: 20
  min_share: 0.005
  min_days: 2
