scope:
  # Query only positions where the panel variants disagree. Positions where
  # every panel variant carries the same mutation cannot change the
  # matched/unexplained decision, so they are pure cost.
  discriminating_positions_only: false

  # Build the co-occurrence position set from all tracked (cowwid/OT) variant
  # signatures rather than just the selected panel. This is what makes the
  # scanner able to detect OT variants missing from the panel.
  use_tracked_variants: true

# Add this block to app/config/cooc_config.yaml to override the "not found in
# WW" verdict thresholds without a rebuild. The code defaults to exactly these
# values if the block is absent. After editing, restart streamlit (the verdict
# is applied in the UI; no worker re-scan needed to retune these).
presence:
  # co-occurrence path (primary — used when the haplotype can be observed)
  confirm_freq: 0.01        # co-occurrence freq (present/co_covered) >= this -> confirmed
  confirm_min_present: 10   # ...and >= 10 co-occurring reads
  absent_min_cov: 3000      # co_covered >= this means co-occurrence could look;
                            #   below it, fall back to the constellation
  absent_max_present: 2     # co-occurring reads < this = haplotype absent

  # constellation fallback (used when co-occurrence is blind — distinctive
  # mutations too spread out to co-occur). Fraction of the readable distinctive
  # constellation present below which the variant is "not found in WW".
  con_floor: 0.5
# NOTE: the per-mutation "testable" coverage (3000 reads) and "present" frequency
# (1%) used to build con_present/con_testable are set in the WORKER
# (process/cooc.py -> constellation_counts defaults). Changing those needs a
# worker restart + re-scan; con_floor above only needs a streamlit restart.

# New co-occurrence check (2026-09): a vote among each panel variant's specific
# markers, per city, pooled over the selected window. Reads only — never the
# deconvolution abundance. Code defaults = these values (process/cooc.py).
check:
  # Which markers — used by the WORKER; changing needs a re-scan.
  out_other_max: 5      # carriers outside the variant's family and outside other
                        #   recombinant roots (the real competitors)
  out_rec_max: 60       # carriers under other recombinant roots (mostly inherited)
  # The vote — applied in the UI; a streamlit restart is enough.
  min_cov: 100          # reads covering a marker to measure it
  present_freq: 0.05    # present: >= 5% of covering reads carry it ...
  link_min: 0.8         # ... and >= 80% of those match the variant at neighbouring
  min_link: 20          #     positions (needs >= 20 such reads)
  absent_freq: 0.01     # absent: < 1% carry it
  confirm_share: 0.75   # present / measurable >= this -> confirmed
  notfound_share: 0.25  # present / measurable <= this -> not found; between -> inconsistent