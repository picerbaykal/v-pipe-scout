name: v-pipe-scout-worker
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Python and lollipop dependencies
  - python=3.13
  - numpy>=1.23
  - scipy>=1.9
  - pandas>=1.5
  - tqdm>=4.64
  - threadpoolctl>=3.5.0
  - ruamel.yaml>=0.15.80
  - strictyaml>=1.7
  - zstandard>=0.20
  - click>=8.0
  - click-option-group>=0.5
  - lollipop>=0.5.3
  - aiohttp
  - requests
  # pydantic 2 (2026-10-08): covvfit needs >= 2.10; app/api/signatures.py,
  # which the worker imports through /app_shared, moved to the pydantic 2 API
  - pydantic>=2.10,<3
  
  # CLI tools - for tallymut assembly
  - xsv=0.13.0
  - gawk=5.3.1
  
  # git: pip installs covvfit from GitHub (see Dockerfile)
  - git

  # other python
  - pyyaml

  # Optional: for your workflow/testing
  - pytest
  - pytest-mock # Added pytest-mock for the mocker fixture

  # Celery worker dependencies
  - celery=5.5.3
  
  - pip
  - pip:
    - pyarrow
    - redis==5.0.1